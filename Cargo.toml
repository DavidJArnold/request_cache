[package]
name = "request_cache"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance, async HTTP request caching library with SQLite persistence and comprehensive error handling"
repository = "https://github.com/yourusername/request_cache"
license = "MIT"
readme = "README.md"
keywords = ["http", "cache", "async", "sqlite", "reqwest"]
categories = ["web-programming::http-client", "caching", "asynchronous"]
exclude = [
    "target/*",
    "examples/*/target/*",
    "*.db",
    "test_*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-sqlite = "0.3.1"
reqwest = { version = "0.12.4", features = ["blocking"] }
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread"] }
url = "2.5"
